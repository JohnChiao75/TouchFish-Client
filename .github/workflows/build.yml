build-linux:
  needs: quality
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.38.7'
        channel: 'stable'

    - name: Install Linux dependencies
      run: |
        sudo apt-get update -y
        # 保留 libmpv-dev 用于编译（不要删）
        sudo apt-get install -y ninja-build libgtk-3-dev libasound2-dev libmpv-dev patchelf
    
    - name: Install dependencies
      run: flutter pub get

    - name: Build Linux
      run: flutter build linux --release

    - name: Bundle libmpv and set RPATH
      run: |
        cd build/linux/x64/release/bundle
        
        # 创建 lib 目录存放动态库
        mkdir -p lib
        
        # 从系统拷贝 libmpv 运行时库到 bundle
        cp /usr/lib/x86_64-linux-gnu/libmpv.so.2 lib/
        
        # 修改二进制 RPATH，优先查找 $ORIGIN/lib（即自身目录下的 lib 文件夹）
        patchelf --set-rpath '$ORIGIN/lib' touchfish_client
        
        # 验证 RPATH 是否改成功（这行只检查，不报错）
        readelf -d touchfish_client | grep RPATH || true

    - name: Create Linux archive
      run: |
        cd build/linux/x64/release/bundle
        zip -r ../../../../../touchfish-linux-x64.zip .
    
    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-build
        path: touchfish-linux-x64.zip